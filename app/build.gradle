        downloadBootstrap("arm", "ed2c65a5de88f536c4f59bad3682a112cf4293430b07ce6f2009bf26005f7aaa", version)
        downloadBootstrap("i686", "f29ded5b47eff6519b5427f78b9599407ca0a1c51fb295df5352d671126f4c81", version)
        downloadBootstrap("x86_64", "f73fd8ea465b5065d94e5af27bce893f3968d3ec901f02f42ef3b71e4a231e2c", version)
    }
    // @}
}

afterEvaluate {
    android.applicationVariants.all { variant ->
        variant.javaCompileProvider.get().dependsOn(downloadBootstraps)
    }
}

// bootstrap ZIP 被 NDK 的 .incbin 直接读取，不能只挂在 Java 编译任务上。
// CI 使用 --parallel；缓存为空时，buildNdkBuild* 可能抢在 javaCompile/downloadBootstraps
// 前启动并报 bootstrap-ARCH.zip 不存在。显式建立依赖，确保冷缓存构建也可靠。
tasks.configureEach { t ->
    if (t.name ==~ /^(configure|build)NdkBuild.*$/) {
        t.dependsOn(tasks.named("downloadBootstraps"))
    }
}

// ZeroTermux add {@ cc-switch 产物必须先于 assets/jniLibs 合并落位。
// AGP 8 的 merge* 任务是惰性创建的，afterEvaluate 里 tasks.findByName 可能取不到
// 而静默跳过——那会打出一个没有 sidecar 的 APK。用 configureEach 按名匹配，
// 任务什么时候被真正创建都能挂上；再用 doFirst 断言兜底，宁可构建失败也不出残包。
tasks.configureEach { t ->
    if (t.name ==~ /^merge.*(Assets|JniLibFolders|NativeLibs)$/) {
        t.dependsOn(tasks.named("downloadCcsArtifacts"))
    }
}

tasks.configureEach { t ->
    if (t.name ==~ /^merge.*NativeLibs$/) {
        t.doFirst {
            def buildArch = System.getProperty("arch", "all")
            boolean needsArm64 = buildArch in ["all", "universal", "arm64"]
            if (needsArm64) {
                def so = new File(projectDir, "ccs-artifacts/jniLibs/arm64-v8a/libccsidecar.so")
                if (!so.isFile()) {
                    throw new GradleException("cc-switch sidecar 未落位: " + so
                        + "（downloadCcsArtifacts 未生效，APK 会缺少 CC Switch 原生进程）")
                }
            }
            def web = new File(projectDir, "ccs-artifacts/assets/ccs-web.zip")
            if (!web.isFile()) {
                throw new GradleException("cc-switch 前端产物未落位: " + web)
            }
        }
    }
}
// @}
