        dest    : "ccs-artifacts/jniLibs/arm64-v8a/libccsidecar.so",
        sha256  : "668330a171b699704c380ae979d146d9ae9d99ecb630fca05fa17d922af040f4",
        size    : 17133944L
    ],
    [
        name    : "ccs-web.zip",
        dest    : "ccs-artifacts/assets/ccs-web.zip",
        sha256  : "5b446fa6eda7ab209b7ffa5dabb731b363a8dfd55fc82f56ba9b459d362b021b",
        size    : 2080953L
    ]
]

// 前端产物哈希下沉到 BuildConfig，供 CcsSidecar 当 webroot 缓存目录的 key。
// 不能用 versionCode：它不随每次构建递增，而覆盖安装又不清 filesDir，
// 结果旧前端会被无限复用（前端修复看起来"没生效"就是这个原因）。
android.defaultConfig.buildConfigField "String", "CCS_WEB_SHA256",
    "\"" + ext.ccsArtifacts.find { it.name == "ccs-web.zip" }.sha256 + "\""

def sha256Of(File file) {
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    def buffer = new byte[8192]
    file.withInputStream { input ->
        while (true) {
            def readBytes = input.read(buffer)
            if (readBytes < 0) break
            digest.update(buffer, 0, readBytes)
        }
    }
    def checksum = new BigInteger(1, digest.digest()).toString(16)
    while (checksum.length() < 64) checksum = "0" + checksum
    return checksum
}

def downloadCcsArtifact(Map spec, String tag) {
    def file = new File(projectDir, spec.dest as String)

    if (file.exists()) {
        def actual = sha256Of(file)
        if (actual == spec.sha256) {
            logger.quiet("cc-switch 产物已就绪: " + spec.dest + " (sha256 " + actual + ")")
            return
        }
        logger.quiet("cc-switch 产物哈希不符，删除重下: " + spec.dest + " expected=" + spec.sha256 + " actual=" + actual)
        file.delete()
    }

    // 允许用本地目录覆盖（离线构建 / 调试未发布的产物）
    def override = System.getenv("CCS_ARTIFACT_DIR")
    if (override) {
        def src = new File(override, spec.name as String)
        if (!src.exists()) {
            throw new GradleException("CCS_ARTIFACT_DIR=" + override + " 下缺少 " + spec.name)
        }
        file.parentFile.mkdirs()
        file.bytes = src.bytes
        def actual = sha256Of(file)
        if (actual != spec.sha256) {
            file.delete()
            throw new GradleException("本地 cc-switch 产物哈希不符 " + spec.name + ": expected=" + spec.sha256 + " actual=" + actual)
        }
        logger.quiet("cc-switch 产物取自本地目录: " + src)
        return
    }

    def remoteUrl = "https://github.com/AGAGAG666/cc-switch/releases/download/" + tag + "/" + spec.name
    logger.quiet("下载 cc-switch 产物 " + remoteUrl + " ...")

    file.parentFile.mkdirs()
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    def connection = new URL(remoteUrl).openConnection()
    connection.setInstanceFollowRedirects(true)
    connection.setConnectTimeout(30000)
    connection.setReadTimeout(120000)
    def out = new BufferedOutputStream(new FileOutputStream(file))
    try {
        out << new java.security.DigestInputStream(connection.inputStream, digest)
    } finally {
        out.close()
    }

    def checksum = new BigInteger(1, digest.digest()).toString(16)
    while (checksum.length() < 64) checksum = "0" + checksum
    if (checksum != spec.sha256) {
        file.delete()
        throw new GradleException("cc-switch 产物哈希不符 " + remoteUrl + ": expected=" + spec.sha256 + " actual=" + checksum)
    }
    if (file.length() != spec.size) {
        file.delete()
        throw new GradleException("cc-switch 产物大小不符 " + remoteUrl + ": expected=" + spec.size + " actual=" + file.length())
    }
    logger.quiet("cc-switch 产物校验通过: " + spec.dest + " (" + file.length() + " 字节)")
}

task downloadCcsArtifacts() {
    description "下载并校验 cc-switch Android sidecar 产物（原生可执行 + 前端站点）"
    doLast {
        project.ext.ccsArtifacts.each { spec ->
            downloadCcsArtifact(spec as Map, project.ext.ccsArtifactTag as String)
        }
    }
}
