name: Build APK

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '目标架构'
        required: true
        type: choice
        options:
          - all
          - universal
          - arm
          - arm64
          - x86
          - x86_64
      build_debug:
        description: '编译 Debug 版本'
        type: boolean
        default: true
      build_release:
        description: '编译 Release 版本'
        type: boolean
        default: true
      ccs_web_run:
        description: 'V4 测试 Web CI Run ID（空值使用正式资产）'
        required: false
        type: string
        default: ''
      ccs_sidecar_run:
        description: 'V4 测试 Sidecar CI Run ID'
        required: false
        type: string
        default: ''
      ccs_source_sha:
        description: '两份 CCS CI 资产的完整提交 SHA'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      build_debug:
        required: false
        type: boolean
        default: true
      build_release:
        required: false
        type: boolean
        default: true
      ccs_web_run:
        required: false
        type: string
        default: ''
      ccs_sidecar_run:
        required: false
        type: string
        default: ''
      ccs_source_sha:
        required: false
        type: string
        default: ''
    secrets:
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    env:
      JAVA_VERSION: "17"
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: 测试 CCS CI 资产校验逻辑
        if: ${{ startsWith(github.ref_name, 'test/ccs-v4') || inputs.ccs_web_run != '' || inputs.ccs_sidecar_run != '' || inputs.ccs_source_sha != '' }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          TMPDIR: ${{ runner.temp }}
        run: python3 -m unittest discover -s .github/scripts -p 'test_prepare_ccs_test_assets.py' -v

      - name: 接入同提交 CCS CI 测试资产
        if: ${{ startsWith(github.ref_name, 'test/ccs-v4') || inputs.ccs_web_run != '' || inputs.ccs_sidecar_run != '' || inputs.ccs_source_sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
          CCS_WEB_RUN: ${{ inputs.ccs_web_run }}
          CCS_SIDECAR_RUN: ${{ inputs.ccs_sidecar_run }}
          CCS_SOURCE_SHA: ${{ inputs.ccs_source_sha }}
          CCS_ARCH: ${{ inputs.arch }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CCS_ARCH" == arm64 ]]
          [[ "$CCS_WEB_RUN" =~ ^[0-9]+$ ]]
          [[ "$CCS_SIDECAR_RUN" =~ ^[0-9]+$ ]]
          [[ "$CCS_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          work="$RUNNER_TEMP/ccs-ci-input"
          mkdir -p "$work"
          gh api "repos/AGAGAG666/cc-switch/actions/runs/$CCS_WEB_RUN" > "$work/web-run.json"
          gh api "repos/AGAGAG666/cc-switch/actions/runs/$CCS_SIDECAR_RUN" > "$work/sidecar-run.json"
          python3 .github/scripts/prepare_ccs_test_assets.py \
            --web-run-json "$work/web-run.json" --sidecar-run-json "$work/sidecar-run.json" \
            --source-sha "$CCS_SOURCE_SHA" --validate-only
          gh run download "$CCS_WEB_RUN" -R AGAGAG666/cc-switch --name ccs-android-web --dir "$work/web"
          gh run download "$CCS_SIDECAR_RUN" -R AGAGAG666/cc-switch --name ccs-sidecar_arm64-v8a --dir "$work/sidecar"
          python3 .github/scripts/prepare_ccs_test_assets.py \
            --web-run-json "$work/web-run.json" --sidecar-run-json "$work/sidecar-run.json" \
            --source-sha "$CCS_SOURCE_SHA" --web-zip "$work/web/ccs-web.zip" \
            --sidecar "$work/sidecar/cc-switch" --output-dir "$work/prepared" \
            --gradle app/build.gradle
          echo "CCS_ARTIFACT_DIR=$work/prepared" >> "$GITHUB_ENV"

      - name: 配置 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: on-failure
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY || '' }}

      - name: 缓存 Bootstrap
        uses: actions/cache@v5
        with:
          path: app/src/main/cpp/bootstrap-*.zip
          key: bootstrap-${{ hashFiles('app/build.gradle') }}
          restore-keys: bootstrap-

      - name: 给 gradlew 执行权限
        run: chmod +x gradlew

      - name: 映射架构名称
        id: abi
        run: |
          case "${{ inputs.arch }}" in
            all)       echo "abi=all" >> $GITHUB_OUTPUT ;; 
            universal) echo "abi=universal" >> $GITHUB_OUTPUT ;;
            arm)       echo "abi=armeabi-v7a" >> $GITHUB_OUTPUT ;;
            arm64)     echo "abi=arm64-v8a" >> $GITHUB_OUTPUT ;;
            x86)       echo "abi=x86" >> $GITHUB_OUTPUT ;;
            x86_64)    echo "abi=x86_64" >> $GITHUB_OUTPUT ;;
          esac

      - name: SQL 系统文件选择专项单测
        if: ${{ startsWith(github.ref_name, 'test/ccs-v4') }}
        run: >-
          ./gradlew --build-cache --stacktrace :app:testReleaseUnitTest
          --tests 'com.termux.zerocore.ccs.CcsSqlImport*Test'
          -Darch=arm64

      - name: 核对 SQL 专项单测报告
        if: ${{ startsWith(github.ref_name, 'test/ccs-v4') }}
        run: >-
          python3 -c 'from pathlib import Path; import xml.etree.ElementTree as E;
          reports=list(Path("app/build/test-results/testReleaseUnitTest").glob("TEST-com.termux.zerocore.ccs.CcsSqlImport*Test.xml"));
          assert len(reports)==4, "Expected four SQL test class reports";
          roots=[E.parse(p).getroot() for p in reports];
          totals={k:sum(int(r.get(k,"0")) for r in roots) for k in ("tests","failures","errors","skipped")};
          assert totals=={"tests":39,"failures":0,"errors":0,"skipped":0}, totals;
          print("SQL_TEST_RESULTS="+str(totals))'

      - name: 编译 APK (${{ inputs.arch }})
        run: |
          TASKS=""
          if [ "${{ inputs.build_debug }}" = "true" ]; then
            TASKS=":app:assembleDebug"
          fi
          if [ "${{ inputs.build_release }}" = "true" ]; then
            TASKS="$TASKS :app:assembleRelease"
          fi

          if [ -z "$(echo $TASKS)" ]; then
            echo "没有选择任何编译目标"
            exit 1
          fi

          ./gradlew --build-cache --parallel --stacktrace $TASKS -Darch=${{ inputs.arch }}

      - name: 上传 Debug APK (${{ steps.abi.outputs.abi }})
        if: ${{ inputs.build_debug && inputs.arch != 'all' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ZeroTermux-Nightly_debug_${{ steps.abi.outputs.abi }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: 上传 Release APK (${{ steps.abi.outputs.abi }})
        if: ${{ inputs.build_release && inputs.arch != 'all' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ZeroTermux-Nightly_release_${{ steps.abi.outputs.abi }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      # all 模式下按架构分别上传，避免打包成一个 zip
      - name: 上传 Debug APK (universal)
        if: ${{ inputs.build_debug && inputs.arch == 'all' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ZeroTermux-Nightly_debug_universal
          path: app/build/outputs/apk/debug/*_universal.apk
          if-no-files-found: ignore
      - name: 上传 Debug APK (armeabi-v7a)
        if: ${{ inputs.build_debug && inputs.arch == 'all' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ZeroTermux-Nightly_debug_armeabi-v7a
          path: app/build/outputs/apk/debug/*_armeabi-v7a.apk
          if-no-files-found: ignore
      - name: 上传 Debug APK (arm64-v8a)
        if: ${{ inputs.build_debug && inputs.arch == 'all' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ZeroTermux-Nightly_debug_arm64-v8a
          path: app/build/outputs/apk/debug/*_arm64-v8a.apk
          if-no-files-found: ignore
      - name: 上传 Debug APK (x86)
        if: ${{ inputs.build_debug && inputs.arch == 'all' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ZeroTermux-Nightly_debug_x86
          path: app/build/outputs/apk/debug/*_x86.apk
          if-no-files-found: ignore
      - name: 上传 Debug APK (x86_64)
        if: ${{ inputs.build_debug && inputs.arch == 'all' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ZeroTermux-Nightly_debug_x86_64
          path: app/build/outputs/apk/debug/*_x86_64.apk
          if-no-files-found: ignore

      - name: 上传 Release APK (universal)
        if: ${{ inputs.build_release && inputs.arch == 'all' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ZeroTermux-Nightly_release_universal
          path: app/build/outputs/apk/release/*_universal.apk
          if-no-files-found: ignore
      - name: 上传 Release APK (armeabi-v7a)
        if: ${{ inputs.build_release && inputs.arch == 'all' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ZeroTermux-Nightly_release_armeabi-v7a
          path: app/build/outputs/apk/release/*_armeabi-v7a.apk
          if-no-files-found: ignore
      - name: 上传 Release APK (arm64-v8a)
        if: ${{ inputs.build_release && inputs.arch == 'all' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ZeroTermux-Nightly_release_arm64-v8a
          path: app/build/outputs/apk/release/*_arm64-v8a.apk
          if-no-files-found: ignore
      - name: 上传 Release APK (x86)
        if: ${{ inputs.build_release && inputs.arch == 'all' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ZeroTermux-Nightly_release_x86
          path: app/build/outputs/apk/release/*_x86.apk
          if-no-files-found: ignore
      - name: 上传 Release APK (x86_64)
        if: ${{ inputs.build_release && inputs.arch == 'all' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ZeroTermux-Nightly_release_x86_64
          path: app/build/outputs/apk/release/*_x86_64.apk
          if-no-files-found: ignore
